name: ciraGram Windows x64 executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 360

    strategy:
      matrix:
        arch: [x64]
        qt: [qt6]
        generator: ["Ninja Multi-Config"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Python 3.12 for plugins.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        shell: bash
        env:
          GH_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Репозиторий приватный: actions/checkout не видит ключ из-за ссылки TBuild,
          # поэтому клонируем вручную с токеном (он не сохраняется в .git/config).
          AUTH=$(printf 'x-access-token:%s' "$GH_ACTIONS_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY" "$TBUILD/$REPO_NAME"

      - name: Apply local source snapshot.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          git submodule update --init --depth=1
          # Вложенные сабмодули (quickjs внутри widget-sandbox и др.) нужны для сборки.
          # cppgir с gitlab нужен только на Linux и может отказать в доступе: пропускаем.
          git -C cmake config submodule.external/glib/cppgir.update none
          git submodule update --init --recursive --depth=1
          test -f Telegram/ThirdParty/widget-sandbox/packages/ios/Sources/CQuickJS/quickjs/quickjs.c
          # Патчи могли уже войти в код: применяем только если ложатся чисто.
          if git apply --check .github/windows-exe/source.patch 2>/dev/null; then
            git apply .github/windows-exe/source.patch
          else
            echo "source.patch: пропущен (уже в коде)"
          fi
          if git -C Telegram/lib_ui apply --check ../../.github/windows-exe/lib-ui.patch 2>/dev/null; then
            git -C Telegram/lib_ui apply ../../.github/windows-exe/lib-ui.patch
          else
            echo "lib-ui.patch: пропущен (уже в сабмодуле)"
          fi

      - name: Rebrand to ciraGram.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          pip install pillow
          python cira-cloud/rebrand.py .
          python cira-cloud/logo.py .

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Visual Studio ATL component.
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if (-not (Test-Path $vswhere) -or -not (Test-Path $setup)) {
            throw "Visual Studio Installer is incomplete at $installer."
          }

          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $path) {
            throw "No Visual Studio instance provides $toolsComponent."
          }

          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory `
            | Where-Object { $_.Name -like '14.44.*' } `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          if (-not $toolset) {
            throw "The selected Visual Studio instance has no 14.44 toolset."
          }
          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (Test-Path $header) {
            Write-Host "ATL is already installed for $($toolset.Name)."
            exit 0
          }

          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify',
            '--installPath', "`"$path`"",
            '--add', $atlComponent,
            '--quiet', '--norestart', '--nocache'
          )
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer exited with $($process.ExitCode)."
          }
          if (-not (Test-Path $header)) {
            throw "$atlComponent completed without installing $header."
          }
      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      - name: Free disk space before libraries.
        shell: pwsh
        run: |
          function Free { [math]::Round((Get-PSDrive C).Free / 1GB, 1) }
          Write-Host "Free on C: before cleanup: $(Free) GB"
          $dirs = @(
            'C:\Android', 'C:\Program Files\Android', 'C:\Program Files (x86)\Android',
            'C:\Microsoft\AndroidNDK', 'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\PostgreSQL', 'C:\Program Files\MongoDB', 'C:\Strawberry',
            'C:\Julia', 'C:\mysql', 'C:\Program Files\Azure Cosmos DB Emulator',
            'C:\Program Files (x86)\Microsoft SDKs\Azure', 'C:\Program Files\Google',
            'C:\Program Files (x86)\Google', 'C:\Program Files\Mozilla Firefox',
            'C:\Program Files (x86)\Microsoft\Edge',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\hostedtoolcache\windows\Java_Adopt_jdk',
            'C:\hostedtoolcache\windows\go', 'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy', 'C:\hostedtoolcache\windows\node',
            'C:\hostedtoolcache\windows\CodeQL'
          )
          foreach ($d in $dirs) {
            if (Test-Path $d) {
              cmd /c rd /s /q "$d" 2>$null
              Write-Host "removed $d -> free $(Free) GB"
            }
          }
          Write-Host "Free on C: after cleanup: $(Free) GB"

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent ${{ matrix.qt }}

      - name: Disk report after libraries.
        if: always()
        shell: pwsh
        run: |
          Write-Host "Free on C: $([math]::Round((Get-PSDrive C).Free / 1GB, 1)) GB"
          Get-ChildItem "$env:USERPROFILE\TBuild" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $n = $_.Name
            Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $size = (Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              "{0,8:N1} GB  {1}\{2}" -f ($size / 1GB), $n, $_.Name
            }
          } | Sort-Object -Descending | Select-Object -First 15

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="Telegram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          echo "TDESKTOP_BUILD_DEFINE=" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' -o '(' '(' -path '*/tlottie/*' -o -path '*/wallet-engine/*' ')' ! -path '*/target/*' ')' ')' -type f ')' -o '(' -empty ! -path '*/tlottie/*' ! -path '*/wallet-engine/*' ')' ')' -delete

      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache-third-party.outputs.cache-primary-key }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache-qt.outputs.cache-primary-key }}

      - name: Free disk space before build.
        shell: pwsh
        run: |
          # После сборки библиотек msys64 больше не нужен.
          if (Test-Path 'C:\msys64') { cmd /c rd /s /q "C:\msys64" 2>$null }
          Get-PSDrive -PSProvider FileSystem | ForEach-Object { "{0}: free {1:N1} GB" -f $_.Name, ($_.Free / 1GB) }
          "CPU cores: $env:NUMBER_OF_PROCESSORS"

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D Python3_ROOT_DIR="%pythonLocation%" ^
          -D Python3_FIND_REGISTRY=NEVER ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          %TDESKTOP_BUILD_DEFINE%
          if errorlevel 1 exit /b 1

          cmake --build ..\out --config Debug --target Telegram --parallel %NUMBER_OF_PROCESSORS%

      - name: Package Windows x64 executable.
        shell: pwsh
        run: |
          $source = Join-Path $env:TBUILD "$env:REPO_NAME\out\Debug\Telegram.exe"
          if (-not (Test-Path $source)) { throw "Missing executable: $source" }
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item $source artifact\ciraGram.exe
          Copy-Item "$env:TBUILD\$env:REPO_NAME\LICENSE" artifact\LICENSE
          $ver = (python --version).Split(' ')[1]
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile py-embed.zip
          Expand-Archive py-embed.zip -DestinationPath artifact -Force
          Remove-Item artifact\python.exe, artifact\pythonw.exe -ErrorAction SilentlyContinue
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path artifact\ciraGram.exe))
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550) { throw "Invalid PE signature" }
          if ([BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) { throw "Expected Windows x64 executable" }
          $hash = (Get-FileHash artifact\ciraGram.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ciraGram.exe" | Set-Content artifact\SHA256SUMS.txt
          Write-Host "Verified Windows x64 PE: $hash"
          & dumpbin /dependents artifact\ciraGram.exe

      - name: Upload Windows x64 executable.
        uses: actions/upload-artifact@v7
        with:
          name: ciraGram-Windows-x64-Debug
          path: artifact\
          if-no-files-found: error
          retention-days: 14
